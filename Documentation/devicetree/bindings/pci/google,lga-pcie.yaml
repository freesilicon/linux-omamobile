%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/google,lga-pcie.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Laguna (Tensor G5) PCIe Root Complex

maintainers:
  - Bobby Bones <saariuscrypto@gmail.com>

description:
  The Google Laguna (Tensor G5) PCIe host controller integrates a Synopsys
  DesignWare PCIe Root Complex with Google TOP/SII glue registers, CPM clocks
  and resets, HSIO_S power domains, and GIA error/link-event aggregators.

allOf:
  - $ref: /schemas/pci/pci-host-bridge.yaml#
  - $ref: /schemas/pci/snps,dw-pcie-common.yaml#

properties:
  compatible:
    const: google,lga-pcie

  reg:
    minItems: 5
    items:
      - description: SII wrapper registers
      - description: TOP wrapper registers
      - description: Optional PHY SRAM region for firmware handshake
      - description: DWC Data Bus Interface (DBI) registers
      - description: DWC internal Address Translation Unit (iATU) registers
      - description: PCIe configuration space aperture

  reg-names:
    oneOf:
      - items:
          - const: sii
          - const: top
          - const: phy_sram
          - const: dbi
          - const: atu
          - const: config
      - items:
          - const: sii
          - const: top
          - const: dbi
          - const: atu
          - const: config

  clocks:
    minItems: 1
    maxItems: 2

  clock-names:
    minItems: 1
    items:
      - const: phy_fw
      - const: aux_clk

  resets:
    minItems: 4
    maxItems: 4

  reset-names:
    items:
      - const: init
      - const: perst
      - const: app_hold_phy
      - const: power_up

  power-domains:
    maxItems: 1

  interrupts:
    minItems: 1
    maxItems: 10

  interrupt-names:
    oneOf:
      - minItems: 1
        items:
          - const: msi
          - const: cpl_timeout
          - const: link_down
      - minItems: 8
        items:
          - const: msi0
          - const: msi1
          - const: msi2
          - const: msi3
          - const: msi4
          - const: msi5
          - const: msi6
          - const: msi7
          - const: cpl_timeout
          - const: link_down

  perstn-gpios:
    description: Endpoint PERST# reset GPIO (active low).
    maxItems: 1

  google,perst-delay-us:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Delay in microseconds after deasserting PERST# before LTSSM start.
    default: 20000

  google,posted-rx-q-data-credits:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: VC0 posted RX queue data credits programmed into DBI port logic.

  google,skip-link-equalization:
    type: boolean
    description: Disable Gen3/Gen4 link equalization phase during LTSSM training.

  google,l1-pwrgate-disable:
    type: boolean
    description: Disable SII L1 power-gating control bit.

  google,allow-suspend-in-linkup:
    type: boolean
    description:
      Allow system suspend while the link remains up and operate the root
      complex on demand via endpoint power-on/power-off requests.

  link-timeout-ms:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Link training timeout value programmed in DBI port logic.

  iommu-map: true
  dma-coherent: true

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - power-domains
  - interrupts
  - interrupt-names

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        pcie@3c500000 {
            compatible = "google,lga-pcie";
            reg = <0x0 0x3c500000 0x0 0x94>,
                  <0x0 0x3c520000 0x0 0xbc>,
                  <0x0 0x3c550000 0x0 0xa000>,
                  <0x0 0x3c800000 0x0 0xd00>,
                  <0x0 0x3cb00000 0x0 0x1000>,
                  <0x0 0x60000000 0x0 0x100000>;
            reg-names = "sii", "top", "phy_sram", "dbi", "atu", "config";
            #address-cells = <3>;
            #size-cells = <2>;
            device_type = "pci";
            linux,pci-domain = <1>;
            bus-range = <0x00 0xff>;
            ranges = <0x01000000 0x0 0x60100000 0x0 0x60100000 0x0 0x100000>,
                     <0x02000000 0x0 0x60200000 0x0 0x60200000 0x0 0x1fe00000>;
            clocks = <&hsios_phy_fw_clk>, <&hsios_aux_clk>;
            clock-names = "phy_fw", "aux_clk";
            resets = <&hsios_resets 4>,
                     <&hsios_resets 0>,
                     <&hsios_resets 1>,
                     <&hsios_resets 2>;
            reset-names = "init", "perst", "app_hold_phy", "power_up";
            power-domains = <&hsio_s_pcie_pd>;
            interrupts-extended = <&gic GIC_SPI 524 IRQ_TYPE_EDGE_RISING 0>,
                                  <&hsios_pulse_gia_4 14>,
                                  <&hsios_pulse_gia_3 17>;
            interrupt-names = "msi", "cpl_timeout", "link_down";
            perstn-gpios = <&pinctrl_hsios 11 GPIO_ACTIVE_LOW>;
            google,perst-delay-us = <20000>;
            google,posted-rx-q-data-credits = <0x51>;
            google,skip-link-equalization;
            num-lanes = <1>;
            max-link-speed = <3>;
        };
    };
