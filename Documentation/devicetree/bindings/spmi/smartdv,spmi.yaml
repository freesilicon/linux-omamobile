%YAML 1.2
---
$id: http://devicetree.org/schemas/spmi/smartdv,spmi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartDV SPMI controller

maintainers:
  - Bobby Bones <saariuscrypto@gmail.com>

allOf:
  - $ref: spmi.yaml#

properties:
  compatible:
    enum:
      - smartdv,spmi
      - google,smartdv-spmi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  clock-frequency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Bus clock frequency in Hz.

  master_arb_en:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Enable SPMI bus arbitration when multiple masters share the bus.

  master_id:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: SPMI master identifier (0-3).

  spmi_ver:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Supported SPMI protocol version encoded in CTRL register.

  arb_retry_limit:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Arbitration retry limit programmed into CTRL register.

  prescalar:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Clock divider prescalar programmed into CTRL register.

  read_latancy:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Read data capture latency in clock cycles (legacy DT spelling).

  read-latency:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: Read data capture latency in clock cycles.

  arb_scl_delay:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: SCLK arbitration delay programmed into CTRL register.

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/spmi/spmi.h>

    spmi@53f1000 {
        compatible = "smartdv,spmi";
        reg = <0x0 0x053f1000 0x0 0x300>;
        clock-frequency = <19200000>;
        master_arb_en = <1>;
        master_id = <0>;
        spmi_ver = <1>;
        arb_retry_limit = <6>;
        prescalar = <1>;
        read_latancy = <0>;
        arb_scl_delay = <0>;
        #address-cells = <2>;
        #size-cells = <0>;

        pmic@f {
            reg = <0xf SPMI_USID>;
        };
    };
